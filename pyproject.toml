[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysup"
version = "0.1.0"
description = "A small process supervisor in the spirit of supervisord"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pysup = "pysup.cli:main"

[tool.setuptools.packages.find]
include = ["pysup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
